# Reference nginx settings for tegania.com (static site).
# Merge these lines into the existing `server { listen 443 ssl; server_name tegania.com; ... }`
# block on the Linode server (usually /etc/nginx/sites-available/<name>), keeping its ssl_* lines.
# Then test and reload:   sudo nginx -t && sudo systemctl reload nginx

    root /var/www/tegania.com;          # ← folder you upload the site files into
    index index.html;

    # Branded 404 page
    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # HTML: always revalidate so visitors get updates right away
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # CSS/JS are versioned with ?v=N in index.html; images/icons change rarely
    location ~* \.(css|js|png|jpg|jpeg|svg|ico|webmanifest|woff2?)$ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Small security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Compression
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/manifest+json application/xml text/plain;
